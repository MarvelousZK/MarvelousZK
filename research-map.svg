<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">From optical signals to measurable fields</title>
  <desc id="desc">A research map connecting optical measurement, physical modeling, inverse reconstruction, and three-dimensional fields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1628"/>
      <stop offset="1" stop-color="#111F37"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D0C3" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#39D0C3"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="field" cx="50%" cy="45%" r="58%">
      <stop offset="0" stop-color="#39D0C3" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#2F81F7" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="760" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="380" cy="260" r="190" fill="url(#field)"/>

  <g opacity="0.18" stroke="#7D93B5" fill="none">
    <path d="M34 90 H726 M34 170 H726 M34 250 H726 M34 330 H726 M34 410 H726"/>
    <path d="M110 40 V480 M220 40 V480 M330 40 V480 M440 40 V480 M550 40 V480 M660 40 V480"/>
  </g>

  <g fill="none" stroke="url(#beam)" stroke-width="4">
    <path d="M120 145 C245 132 250 220 335 236"/>
    <path d="M640 142 C515 132 510 220 425 236"/>
    <path d="M120 380 C240 395 260 305 337 282"/>
    <path d="M640 382 C520 395 500 305 423 282"/>
  </g>

  <g fill="#39D0C3" filter="url(#glow)" opacity="0.55">
    <circle cx="380" cy="260" r="42"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="380" cy="260" r="77" fill="#152944" stroke="#39D0C3" stroke-width="2"/>
    <circle cx="380" cy="260" r="59" fill="none" stroke="#2F81F7" stroke-width="1.5" stroke-dasharray="4 7"/>
    <path d="M338 261 C353 230 365 289 380 260 C395 231 408 289 423 258" fill="none" stroke="#F1F7FF" stroke-width="4" stroke-linecap="round"/>
    <text x="380" y="317" text-anchor="middle" fill="#9FB6D8" font-family="Segoe UI, Arial, sans-serif" font-size="16" letter-spacing="2">LIGHT → FIELD</text>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" filter="url(#soft)">
    <g transform="translate(46 88)">
      <rect width="192" height="106" rx="17" fill="#14243B" stroke="#2F81F7"/>
      <circle cx="29" cy="30" r="10" fill="#2F81F7"/>
      <path d="M14 67 C45 43 64 92 94 66 C121 43 143 83 174 59" fill="none" stroke="#6EA8FE" stroke-width="3"/>
      <text x="51" y="36" fill="#F1F7FF" font-size="17" font-weight="600">OPTICAL SIGNALS</text>
      <text x="18" y="91" fill="#9FB6D8" font-size="14">phase · deflection · images</text>
    </g>

    <g transform="translate(522 88)">
      <rect width="192" height="106" rx="17" fill="#14243B" stroke="#39D0C3"/>
      <circle cx="29" cy="30" r="10" fill="#39D0C3"/>
      <path d="M25 70 L72 51 L113 73 L164 47" fill="none" stroke="#75E6DD" stroke-width="3"/>
      <text x="51" y="36" fill="#F1F7FF" font-size="17" font-weight="600">PHYSICAL MODELS</text>
      <text x="18" y="91" fill="#9FB6D8" font-size="14">rays · geometry · calibration</text>
    </g>

    <g transform="translate(46 326)">
      <rect width="192" height="106" rx="17" fill="#14243B" stroke="#A371F7"/>
      <circle cx="29" cy="30" r="10" fill="#A371F7"/>
      <path d="M26 73 C54 40 78 92 104 61 C126 37 148 75 169 54" fill="none" stroke="#C7A5FF" stroke-width="3"/>
      <text x="51" y="36" fill="#F1F7FF" font-size="17" font-weight="600">INVERSE METHODS</text>
      <text x="18" y="91" fill="#9FB6D8" font-size="14">optimization · integration</text>
    </g>

    <g transform="translate(522 326)">
      <rect width="192" height="106" rx="17" fill="#14243B" stroke="#EF8354"/>
      <circle cx="29" cy="30" r="10" fill="#EF8354"/>
      <g transform="translate(24 52)" fill="none" stroke="#FFB08E" stroke-width="2">
        <ellipse cx="34" cy="20" rx="29" ry="13"/>
        <ellipse cx="34" cy="20" rx="18" ry="28"/>
        <path d="M5 20 H63 M34 -8 V48"/>
      </g>
      <text x="51" y="36" fill="#F1F7FF" font-size="17" font-weight="600">3D FIELDS</text>
      <text x="93" y="70" fill="#9FB6D8" font-size="14">index · temperature</text>
      <text x="93" y="91" fill="#9FB6D8" font-size="14">shape · flow</text>
    </g>
  </g>

  <text x="380" y="475" text-anchor="middle" fill="#6F86A8" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="3">OPTICAL METROLOGY · COMPUTATIONAL IMAGING</text>
</svg>

